name: ingest-package
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'package') || contains(github.event.issue.title, 'publish:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and update registry
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const body = context.payload.issue.body || '';
            const m = body.match(/```json\s*([\s\S]*?)```/);
            if (!m) {
              core.setFailed('No JSON block in issue');
              return;
            }
            let pkg;
            try { pkg = JSON.parse(m[1]); } catch (e) {
              core.setFailed('Invalid JSON');
              return;
            }
            const name = pkg.name;
            const version = pkg.version;
            if (!name || !version || !pkg.dist?.tarball || !pkg.dist?.integrity) {
              core.setFailed('Missing required fields');
              return;
            }
            if (!/^[a-z0-9][a-z0-9_-]*$/.test(name)) {
              core.setFailed('Invalid name');
              return;
            }
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              core.setFailed('Invalid version');
              return;
            }

            const pkgDir = path.join('registry', 'packages');
            fs.mkdirSync(path.join(pkgDir, name), { recursive: true });

            const verPath = path.join(pkgDir, name, `${version}.json`);
            const verMeta = {
              name,
              version,
              description: pkg.description || '',
              main: pkg.main || 'src/main.at',
              altair: pkg.altair || '>=1.8.5',
              dist: {
                tarball: pkg.dist.tarball,
                integrity: pkg.dist.integrity,
              },
            };
            fs.writeFileSync(verPath, JSON.stringify(verMeta, null, 2) + '\n');

            const metaPath = path.join(pkgDir, `${name}.json`);
            let meta = { name, description: pkg.description || '', versions: [], latest: version };
            if (fs.existsSync(metaPath)) {
              meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
              meta.description = pkg.description || meta.description;
            }
            if (!meta.versions.includes(version)) meta.versions.push(version);
            meta.versions.sort((a, b) => {
              const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0);
              return 0;
            });
            meta.latest = meta.versions[meta.versions.length - 1];
            fs.writeFileSync(metaPath, JSON.stringify(meta, null, 2) + '\n');

            const indexPath = path.join('registry', 'index.json');
            let index = { registry: 'altair-npn', version: 1, base: 'https://victios7.github.io/altair-npn/registry', packages: {} };
            if (fs.existsSync(indexPath)) index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
            index.packages = index.packages || {};
            index.packages[name] = {
              description: meta.description,
              versions: meta.versions,
              latest: meta.latest,
            };
            index.base = 'https://victios7.github.io/altair-npn/registry';
            fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');

            core.info(`Ingested ${name}@${version}`);

      - name: Commit
        run: |
          git config user.name "altair-npn-bot"
          git config user.email "bot@users.noreply.github.com"
          git add registry/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "registry: ${{ github.event.issue.title }}"
          git push
      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Paquete añadido al registro. Pages se actualizará en el próximo deploy.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
